[platformio]
default_envs = esp32dev
core_dir = .platformio
src_dir = firmware/src
include_dir = firmware/include
test_dir = firmware/test

[env:esp32dev]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=2000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
test_build_src = no

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -DUNITY_INCLUDE_DOUBLE
extra_scripts = pre:firmware/test/native-toolchain.py
