[platformio]
default_envs = esp32dev
core_dir = .platformio
src_dir = firmware/src
include_dir = firmware/include
test_dir = firmware/test

[env:esp32dev]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.3
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=0
test_build_src = no

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -DUNITY_INCLUDE_DOUBLE
extra_scripts = pre:firmware/test/native-toolchain.py
