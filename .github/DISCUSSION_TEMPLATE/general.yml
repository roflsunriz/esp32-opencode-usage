title: '[雑談] '
body:
  - type: markdown
    attributes:
      value: |-
        esp32-opencode-usageに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。認証コード、Wi-Fi認証情報、NVS・全フラッシュのダンプ、個人設定入りファームウェアも添付しないでください。
        一般 / プロジェクト全般の相談や共有
  - type: markdown
    attributes:
      value: Cookie、Bearer token、Wi-Fiパスワード、個人情報は投稿しないでください。
  - type: textarea
    id: topic
    attributes:
      label: 話題と背景
      description: 相談、共有したいこと、期待する結果を書いてください。
    validations:
      required: true
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 話題の背景、参考資料、期待する議論の結果を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
