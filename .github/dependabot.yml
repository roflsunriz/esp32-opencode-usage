# Required labels are maintained by workflows/dependabot-labels.yml.
# Generate bun.lock with `bun run deps:lock`; Dependabot currently supports format 1.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
