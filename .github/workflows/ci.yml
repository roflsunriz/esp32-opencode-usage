name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Set up Python for USB
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python checks
        run: python -m pip install -r requirements-dev.txt
      - name: Check USB worker types
        run: python -m mypy --strict host/serial-worker.py scripts/update-ca.py scripts/capture-lcd.py
      - name: Check Python formatting
        run: python -m ruff format --check host/serial-worker.py scripts/update-ca.py scripts/capture-lcd.py firmware/test/native-toolchain.py
      - name: Verify USB worker starts
        run: python host/serial-worker.py --list
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Type check
        run: bun run type-check
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Audit dependencies
        run: bun run audit

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: .platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build esp32dev firmware
        run: pio run -e esp32dev
      - name: Run native firmware tests
        run: pio test -e native
