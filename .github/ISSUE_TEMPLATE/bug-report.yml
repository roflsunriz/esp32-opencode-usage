name: 不具合報告
description: 再現可能な不具合を報告する
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        esp32-opencode-usageに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。認証コード、Wi-Fi認証情報、NVS・全フラッシュのダンプ、個人設定入りファームウェアも添付しないでください。
        投稿前に[README](https://github.com/roflsunriz/esp32-opencode-usage/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/esp32-opencode-usage/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/esp32-opencode-usage/blob/main/SECURITY.md)の案内に従ってください。
  - type: markdown
    attributes:
      value: Cookie、Bearer token、Wi-Fiパスワード、個人情報は記載しないでください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存Issueを検索しました。
          required: false
        - label: 可能な範囲で最新の公開版でも確認しました。
          required: false
  - type: input
    id: version
    attributes:
      label: バージョンまたはコミット
      placeholder: v0.1.0 または 0123456
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 対象
      options:
        - ホスト側
        - ESP32ファームウェア
        - USBシリアル連携
        - LAN HTTP連携
        - CIまたはリリース
        - その他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 対象と環境
      description: OS、Bun、PlatformIO、ボード、LCD、接続方法を書いてください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 再現に必要な操作を順番に書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: 秘密情報を除いたエラーやログを含めてください。
    validations:
      required: true
  - type: textarea
    id: diagnostics-common
    attributes:
      label: 診断情報
      description: 秘密情報を除いたログや画面を添付してください。
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 発生頻度、直前の変更、回避策、確認できない条件を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
