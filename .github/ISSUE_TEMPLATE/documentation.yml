name: ドキュメントの改善
description: 誤記、リンク切れ、手順不足、説明の改善を報告する
title: '[Docs] '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |-
        esp32-opencode-usageに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。認証コード、Wi-Fi認証情報、NVS・全フラッシュのダンプ、個人設定入りファームウェアも添付しないでください。
        投稿前に[README](https://github.com/roflsunriz/esp32-opencode-usage/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/esp32-opencode-usage/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/esp32-opencode-usage/blob/main/SECURITY.md)の案内に従ってください。
  - type: textarea
    id: legacy-1
    attributes:
      label: 対象文書
      description: ファイル名、見出し、URL、手順などを示してください。
    validations:
      required: false
  - type: textarea
    id: legacy-2
    attributes:
      label: 現在の記載と問題
      description: 現在の記載と、読者が分からない・実行できない点を書いてください。
    validations:
      required: false
  - type: textarea
    id: legacy-3
    attributes:
      label: 期待する記載
      description: 分かる範囲で修正案や期待する説明を書いてください。
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 根拠となる資料や、試した環境と結果を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
